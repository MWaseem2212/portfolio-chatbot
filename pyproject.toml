[project]
name = "portfolio-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MWaseem2212", email = "waseem.dev2212@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "lxml>=6.1.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.20.0",
    "ruff>=0.17.4",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
portfolio-chatbot = "portfolio_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
